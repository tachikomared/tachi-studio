name: CI

# The enforcement loop (audit M0): typecheck + both test suites + build on every
# push/PR. The whole test suite runs in ~2s, so the gate is nearly free. Sidecars
# are NOT downloaded here — they're extraResources at package time, and the build
# doesn't need them — which also keeps the freellmapi clone/build out of CI.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    # WINDOWS ONLY, deliberately. This is the platform the app ships on today;
    # macOS and Linux come later, as their own piece of work.
    #
    # Two reasons, both measured. The unit suite carries Windows path
    # assumptions in a known set of files — `C:\Fake…` is a RELATIVE path to a
    # POSIX runner, so those tests passed here for months and failed the first
    # time they ever ran on Linux. And a private repository BILLS its minutes:
    # macOS runners cost ten times a Linux one, and running three platforms per
    # push exhausted the account's allowance in a single day. A leg that cannot
    # pass yet and costs the most is not a gate, it is a bill.
    #
    # Bringing them back = fix the path assumptions, then add the two entries.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # No version here on purpose: pnpm/action-setup reads `packageManager`
        # from package.json, so the toolchain is pinned in ONE place. Hardcoding
        # 9 here is what made the first real release run fail on all three
        # runners — overrides moved to pnpm-workspace.yaml in pnpm 10, which a
        # pnpm 9 install cannot see, so --frozen-lockfile reported a config
        # mismatch against a lockfile written by 11.
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (renderer + main)
        run: pnpm -F tachi-studio-desktop typecheck
      - name: Test (core)
        run: pnpm -F core test
      - name: Test (desktop)
        run: pnpm -F tachi-studio-desktop test
      - name: Build (electron-vite)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm -F tachi-studio-desktop build
      # THIRD_PARTY_NOTICES.md is generated from the production dependency graph
      # and SHIPS INSIDE the installer (electron-builder extraResources), which
      # is what makes staleness a licensing problem rather than a tidiness one.
      # The generator refuses to classify a licence family it has never seen, so
      # this also fails the day a new copyleft dependency arrives.
      - name: Third-party notices are current
        run: node scripts/gen-notices.mjs --check
