# Sprint B3 — provider-as-data registry.
# Schema inspired by NangoHQ/nango's `providers.yaml` concept (Elastic License v2);
# all data values here are written fresh from public provider documentation,
# not copied from Nango's YAML.
#
# Each provider entry:
#   id          — unique slug (used as a key below and passed around the app)
#   label       — human-readable display name
#   kind        — oauth_pkce | oauth_device | api_key | local
#   authBaseUrl — (oauth only) authorization endpoint the browser opens
#   tokenUrl    — (oauth only) server-side token exchange endpoint
#   clientId    — (optional oauth) registered application client ID
#   scope       — (oauth only) space-separated OAuth scopes
#   verifyUrl   — URL TachiDesk hits to confirm a saved key/token still works
#   verifyAuth  — how to attach the credential: bearer | x-api-key | none

providers:
  anthropic-oauth:
    label:       Anthropic (Pro/Max)
    kind:        oauth_pkce
    authBaseUrl: https://claude.ai/oauth/authorize
    tokenUrl:    https://console.anthropic.com/v1/oauth/token
    clientId:    9d1c250a-e61b-44d9-88ed-5944d1962f5e
    scope:       "org:create_api_key user:profile user:inference"
    verifyUrl:   https://api.anthropic.com/v1/models
    verifyAuth:  bearer

  openrouter:
    label:       OpenRouter
    kind:        oauth_pkce
    authBaseUrl: https://openrouter.ai/auth
    tokenUrl:    https://openrouter.ai/api/v1/auth/keys
    scope:       ""
    verifyUrl:   https://openrouter.ai/api/v1/models
    verifyAuth:  bearer

  bankr-gateway:
    label:      Bankr Gateway
    kind:       api_key
    verifyUrl:  https://llm.bankr.bot/v1/models
    verifyAuth: bearer

  opengateway:
    label:      OpenGateway
    kind:       api_key
    verifyUrl:  https://opengateway.gitlawb.com/v1/models
    verifyAuth: bearer

  openai:
    label:      OpenAI
    kind:       api_key
    verifyUrl:  https://api.openai.com/v1/models
    verifyAuth: bearer

  anthropic:
    label:      Anthropic (Key)
    kind:       api_key
    verifyUrl:  https://api.anthropic.com/v1/models
    verifyAuth: x-api-key

  groq:
    label:      Groq
    kind:       api_key
    verifyUrl:  https://api.groq.com/openai/v1/models
    verifyAuth: bearer

  mistral:
    label:      Mistral
    kind:       api_key
    verifyUrl:  https://api.mistral.ai/v1/models
    verifyAuth: bearer

  cerebras:
    label:      Cerebras
    kind:       api_key
    verifyUrl:  https://api.cerebras.ai/v1/models
    verifyAuth: bearer

  cohere:
    label:      Cohere
    kind:       api_key
    verifyUrl:  https://api.cohere.com/v1/models
    verifyAuth: bearer

  # ── STEAL 2026-06-12 cluster E: free/cheap OpenAI-compatible providers ──────
